<style>
  :root {
    --bg: #ffffff;
    --ink: #0a0a0a;
    --muted: #767676;
    --hairline: #e6e6e6;
    /* Brand is a black wordmark on pure white, identical in any system theme. */
    color-scheme: only light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    overflow-x: hidden;
  }

  body {
    font-family: 'Onest', -apple-system, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    padding: 8vh 6vw;
    text-align: center;
    gap: clamp(2.5rem, 6vh, 4rem);
  }

  @media (prefers-reduced-motion: no-preference) {
    .logo, .statement, .footnote { opacity: 0; }
    .logo { animation: rise 0.9s cubic-bezier(.16,1,.3,1) 0.1s forwards; }
    .statement { animation: rise 0.9s cubic-bezier(.16,1,.3,1) 0.55s forwards; }
    .footnote { animation: rise 0.9s cubic-bezier(.16,1,.3,1) 0.95s forwards; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo {
    width: min(47vw, 275px);
    display: block;
  }
  .logo img {
    width: 100%;
    height: auto;
    display: block;
  }

  .statement {
    max-width: 560px;
    font-family: 'Montserrat', 'Onest', sans-serif;
    font-weight: 900;
    line-height: 1.2;
    letter-spacing: -0.005em;
    font-size: clamp(1rem, 2.6vw, 1.35rem);
    text-transform: lowercase;
  }

  .statement .quiet {
    color: var(--muted);
  }

  .dots {
    display: inline-flex;
    gap: 0.14em;
    vertical-align: baseline;
  }
  .dots span {
    animation: breathe 1.4s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.18s; }
  .dots span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes breathe {
    0%, 100% { opacity: 0.22; }
    50% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .dots span { animation: none; opacity: 0.7; }
  }

  .footnote {
    font-size: clamp(0.72rem, 1.6vw, 0.85rem);
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .signup {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 0.55rem;
    text-decoration: none;
  }

  .tg-cta {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--ink);
    color: var(--bg);
    font-family: 'Onest', sans-serif;
    font-weight: 600;
    font-size: clamp(0.85rem, 2.2vw, 0.95rem);
    padding: 0.7rem 1.4rem;
    border-radius: 999px;
    transition: opacity 0.15s ease;
  }
  .tg-icon {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
  }
  .signup:hover .tg-cta { opacity: 0.75; }
  .signup:active .tg-cta { opacity: 0.55; }


  :focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 4px;
  }
</style>
</head>
